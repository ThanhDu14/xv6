<VirtualHost *:80>
    ServerName demo2.hcmus.edu.vn
    DocumentRoot /var/www/demo2

    <Directory /var/www/demo2>
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/demo2_error.log
    CustomLog ${APACHE_LOG_DIR}/demo2_access.log combined
</VirtualHost>


<VirtualHost *:443>
    ServerName demo2.hcmus.edu.vn
    DocumentRoot /var/www/demo2

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/demo2.crt
    SSLCertificateKeyFile /etc/ssl/private/demo2.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/demo2>
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/demo2_error.log
    CustomLog ${APACHE_LOG_DIR}/demo2_access.log combined
</VirtualHost>
